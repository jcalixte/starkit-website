server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # `cleanUrls: true` means VitePress writes /guide/effects.html and links to /guide/effects, so
  # the extension has to be tried before the directory. Without the `$uri.html` arm every page but
  # the home page 404s.
  location / {
    try_files $uri $uri.html $uri/index.html /404.html;
  }

  # Hashed filenames, so they can be cached until they change their name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # vite-ssg runs with dirStyle: "nested", so /guide/effects is prerendered to
  # guide/effects/index.html. Name that file directly rather than leaning on `$uri/` — the
  # directory arm makes nginx 301 to the trailing-slash form first, and the site's URLs carry no
  # trailing slash. Every route is prerendered and none of them are dynamic, so an unmatched path
  # is a real 404 rather than something the client router could still resolve.
  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404/index.html;

  # Hashed filenames, so they can be cached until they change their name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
}

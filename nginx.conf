server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # vite-ssg runs with dirStyle: "nested", so /guide/effects is prerendered to
  # guide/effects/index.html — the `$uri/` arm serves it with no redirect and no .html suffix.
  # index.html is the last resort so a client-side route still boots the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so they can be cached until they change their name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
}
